<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C89F65" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#004D42" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#003830" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EADBBD"/>
      <stop offset="50%" stop-color="#C89F65"/>
      <stop offset="100%" stop-color="#9A743E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#044A40" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#002923" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <circle cx="320" cy="260" r="245" fill="url(#bgGlow)"/>

  <!-- Am Vang Dai Ngan topographic / acoustic rings -->
  <circle cx="320" cy="260" r="215" stroke="#C89F65" stroke-width="1" stroke-opacity="0.22" stroke-dasharray="4 6"/>
  <circle cx="320" cy="260" r="172" stroke="#EADBBD" stroke-width="1" stroke-opacity="0.18"/>
  <circle cx="320" cy="260" r="128" stroke="#C89F65" stroke-width="1.2" stroke-opacity="0.32" stroke-dasharray="2 4"/>

  <!-- Topographic waves of Dak Lak highlands -->
  <path d="M40 365 Q140 315 230 355 T420 345 T600 325" stroke="#C89F65" stroke-width="1.5" stroke-opacity="0.35" fill="none"/>
  <path d="M40 385 Q150 335 245 375 T435 365 T600 348" stroke="#EADBBD" stroke-width="1.2" stroke-opacity="0.22" fill="none"/>
  <path d="M40 405 Q160 358 260 392 T450 385 T600 370" stroke="#C89F65" stroke-width="1" stroke-opacity="0.18" fill="none"/>

  <!-- Central Digital Batch Passport Card -->
  <rect x="145" y="75" width="350" height="370" rx="24" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="161" y="91" width="318" height="338" rx="16" stroke="#C89F65" stroke-width="0.7" stroke-opacity="0.35"/>

  <!-- Header badge inside card -->
  <rect x="210" y="108" width="220" height="28" rx="14" fill="#003830" stroke="#C89F65" stroke-width="1"/>
  <circle cx="228" cy="122" r="4" fill="#6EE7B7"/>
  <text x="240" y="126" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="11" font-weight="700" fill="#EADBBD">SAMPLE BATCH RECORD</text>

  <!-- Central Seed / Origin Emblem -->
  <circle cx="320" cy="202" r="44" fill="#003830" stroke="#C89F65" stroke-width="1.8"/>
  <path d="M320 172 C336 179, 342 195, 332 211 C322 224, 306 218, 302 204 C298 189, 308 176, 320 172 Z" fill="url(#goldGrad)"/>
  <path d="M320 176 C316 190, 324 201, 320 214" stroke="#003830" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 12-Digit Code Display -->
  <text x="320" y="272" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="9.5" font-weight="600" fill="#C89F65">12-DIGIT TRACEABILITY CODE</text>
  <rect x="188" y="282" width="264" height="40" rx="10" fill="#00241E" stroke="#C89F65" stroke-width="1.2"/>
  <text x="320" y="308" text-anchor="middle" font-family="Courier New, monospace" font-size="21" font-weight="700" letter-spacing="3.5" fill="#EADBBD">9126 1026 1847</text>

  <!-- 3 Verified Pillars inside card -->
  <line x1="185" y1="340" x2="455" y2="340" stroke="#C89F65" stroke-width="0.8" stroke-opacity="0.35"/>

  <text x="230" y="365" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10" fill="#C89F65">ORIGIN</text>
  <text x="230" y="383" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#EADBBD">Đắk Lắk</text>

  <line x1="278" y1="352" x2="278" y2="392" stroke="#C89F65" stroke-width="0.7" stroke-opacity="0.3"/>

  <text x="320" y="365" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10" fill="#C89F65">FARMING</text>
  <text x="320" y="383" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#EADBBD">Circular</text>

  <line x1="362" y1="352" x2="362" y2="392" stroke="#C89F65" stroke-width="0.7" stroke-opacity="0.3"/>

  <text x="410" y="365" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10" fill="#C89F65">BATCH DATA</text>
  <text x="410" y="383" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">Recorded</text>

  <!-- Floating Satellite Nodes (6 links) -->
  <g>
    <rect x="24" y="102" width="144" height="44" rx="12" fill="#002D26" stroke="#C89F65" stroke-width="1.2"/>
    <text x="96" y="121" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10.5" font-weight="700" fill="#C89F65">01. SOIL &amp; LAND</text>
    <text x="96" y="136" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10" fill="#EADBBD">Coordinates &amp; climate</text>
  </g>
  <g>
    <rect x="472" y="102" width="144" height="44" rx="12" fill="#002D26" stroke="#C89F65" stroke-width="1.2"/>
    <text x="544" y="121" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10.5" font-weight="700" fill="#C89F65">02. VERMICOMPOST</text>
    <text x="544" y="136" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10" fill="#EADBBD">Organic soil nutrition</text>
  </g>
  <g>
    <rect x="16" y="238" width="144" height="44" rx="12" fill="#002D26" stroke="#C89F65" stroke-width="1.2"/>
    <text x="88" y="257" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10.5" font-weight="700" fill="#C89F65">03. RIPE HARVEST</text>
    <text x="88" y="272" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10" fill="#EADBBD">Harvest-date log</text>
  </g>
  <g>
    <rect x="480" y="238" width="144" height="44" rx="12" fill="#002D26" stroke="#C89F65" stroke-width="1.2"/>
    <text x="552" y="257" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10.5" font-weight="700" fill="#C89F65">04. PROCESSING</text>
    <text x="552" y="272" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="9.5" fill="#EADBBD">Temp., moisture &amp; ferment.</text>
  </g>
  <g>
    <rect x="34" y="378" width="150" height="44" rx="12" fill="#002D26" stroke="#C89F65" stroke-width="1.2"/>
    <text x="109" y="397" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10.5" font-weight="700" fill="#C89F65">05. SENSORY CUPPING</text>
    <text x="109" y="412" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10" fill="#EADBBD">Batch-specific scoring</text>
  </g>
  <g>
    <rect x="456" y="378" width="150" height="44" rx="12" fill="#002D26" stroke="#C89F65" stroke-width="1.2"/>
    <text x="531" y="397" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10.5" font-weight="700" fill="#C89F65">06. BATCH SEAL</text>
    <text x="531" y="412" text-anchor="middle" font-family="Arial, 'Noto Sans CJK SC', 'Noto Sans CJK JP', 'Noto Sans KR', sans-serif" font-size="10" fill="#EADBBD">Batch identity retained</text>
  </g>
</svg>